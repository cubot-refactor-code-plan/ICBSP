# 主机侧检查（阶段 3 / 5）：algorithm/ 单元测试、分层检查、接入引擎测试。固件要接 CubeMX 工程才能编：
# 生成结果的编译测试是 tools/tests/compile_test.py（要 ARM 工具链与 STM32CubeMX，本地跑）。
name: host-tests

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 分层检查（下层不包含上层）
        run: python3 tools/check_layers.py
      - name: 接入清单自检（tools/manifest.json 的片段占位符、规则引用）
        run: cd tools && python3 -m icbsp_tool.manifest
      - name: 接入引擎测试（.ioc 解析 / 校验 / 生成快照 / 生成区同步）
        run: cd tools && python3 -m unittest discover -s tests -v
      - name: 构建主机单元测试
        run: |
          cmake -S tests/host -B build/host
          cmake --build build/host
      - name: 运行
        run: ctest --test-dir build/host --output-on-failure
