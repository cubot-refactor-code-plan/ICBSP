# OpenOCD 配置：CMSIS-DAP（DAPLink）探针，SWD，外加外置 QSPI Flash（{{QSPI_CHIP}}，QUADSPI Bank {{QSPI_BANK}}）
#
# 只在外置 Flash 方案（ICBSP_FLASH_LAYOUT = QSPI_RAM / QSPI_XIP）写 QSPI、调试 XIP 程序时用；
# 日常烧片内 Flash 仍用 daplink.cfg（不注册外置 bank，见那里的说明）。
# 由 integrate.py 按 .ioc 的 QUADSPI 引脚生成；改了引脚请重新运行 integrate.py。
#
# reset-init（program / reset init 时执行）里用寄存器把 QSPI 引脚和 QUADSPI 配好、切到单线内存映射读，
# stmqspi 驱动在此基础上探测芯片（JEDEC ID）并擦写。此时 CPU 停在复位后，bootloader 还没跑。

source [find interface/cmsis-dap.cfg]

# 部分探针（实测：Horco v0.2）的 USB bulk 端点对 CMD_INFO 不响应，连不上时取消下一行注释改用 HID 后端
# cmsis-dap backend hid

transport select swd

set QUADSPI 1
source [find target/{{OPENOCD_TARGET}}]

proc icbsp_qspi_init {} {
{{QSPI_INIT}}
}

$_CHIPNAME.cpu0 configure -event reset-init {
	icbsp_qspi_init
	adapter speed 4000
}

# GDB 连上时先复位并初始化 QSPI，再让 stmqspi 探测芯片：GDB 一连上就要内存映射（qXfer:memory-map），
# 这时 bank 没探测成功的话，0x90000000 不会被标成 Flash，load 会退化成普通写内存而失败
$_CHIPNAME.cpu0 configure -event gdb-attach {
	reset init
	flash probe $::_QSPINAME
}
