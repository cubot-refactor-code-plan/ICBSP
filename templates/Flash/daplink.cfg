# OpenOCD 配置：CMSIS-DAP（DAPLink）探针，SWD

source [find interface/cmsis-dap.cfg]

# 部分探针（实测：Horco v0.2）的 USB bulk 端点对 CMD_INFO 不响应，连不上时取消下一行注释改用 HID 后端
# cmsis-dap backend hid

transport select swd

# {{MCU}}：CubeMX 的 .ioc 里 Mcu.Name 决定，integrate.py 会自动填
source [find target/{{OPENOCD_TARGET}}]

# 不要在这里注册外置 Flash bank（例如 DM-MC02 的 OCTOSPI2 W25Q64）：注册后 OpenOCD 在 program / reset
# 时会访问 OCTOSPI2，固件没有重新初始化它时会把调试口卡死，只能重新上电。外置 Flash 要单独写脚本烧。
