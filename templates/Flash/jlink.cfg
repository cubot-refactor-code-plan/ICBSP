# OpenOCD 配置：经 jlink 适配器（libjaylink）驱动 SEGGER J-Link，SWD
# 使用前确认当前 OpenOCD 带 jlink 适配器：
#   openocd -c "adapter list" -c "shutdown"

adapter driver jlink
adapter speed 4000

transport select swd

# {{MCU}}：CubeMX 的 .ioc 里 Mcu.Name 决定，integrate.py 会自动填
source [find target/{{OPENOCD_TARGET}}]

# 不要在这里注册外置 Flash bank（例如 DM-MC02 的 OCTOSPI2）：理由见 daplink.cfg 末尾
